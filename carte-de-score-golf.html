    state.departs = c.departs ? c.departs.slice() : [];
    state.courseSavedNotice = false;
    render();
  }
  function newCourseDraft() {
    state.selectedCourseId = null;
    state.courseName = "";
    state.coursePays = "";
    state.numHoles = 18;
    state.pars = Array(18).fill(DEFAULT_PAR);
    state.indexDiff = Array.from({ length: 18 }, function (_, i) { return i + 1; });
    state.departs = [{ nom: "Standard H", genre: "H", cr: 72.0, slope: 130 }, { nom: "Standard F", genre: "F", cr: 72.0, slope: 130 }];
    state.courseSavedNotice = false;
    render();
  }
  function setHoleCount(n) {
    state.numHoles = n;
    var nextPars = Array(n).fill(DEFAULT_PAR);
    for (var i = 0; i < Math.min(n, state.pars.length); i++) nextPars[i] = state.pars[i];
    state.pars = nextPars;
    var nextIdx = Array.from({ length: n }, function (_, i) { return i + 1; });
    for (var j = 0; j < Math.min(n, state.indexDiff.length); j++) nextIdx[j] = state.indexDiff[j];
    state.indexDiff = nextIdx;
    render();
  }
  function updatePar(i, delta) {
    state.pars[i] = Math.min(MAX_PAR, Math.max(MIN_PAR, state.pars[i] + delta));
    render();
  }
  function updateIndexDiff(i, delta) {
    state.indexDiff[i] = Math.min(state.numHoles, Math.max(1, state.indexDiff[i] + delta));
    render();
  }
  function addDepart() {
    state.departs.push({ nom: "Nouveau", genre: "H", cr: 72.0, slope: 130 });
    render();
  }
  function removeDepart(i) {
    if (state.departs.length > 1) { state.departs.splice(i, 1); render(); }
  }
  function updateDepartField(i, field, value) {
    if (!state.departs[i]) return;
    if (field === "cr" || field === "slope") value = parseFloat(value);
    state.departs[i][field] = value;
  }

  // persist course to Supabase (or queue) — returns a Promise resolving to the course id (real or local)
  function persistCurrentCourse() {
    var name = state.courseName.trim() || "Parcours sans nom";
    state.courseName = name;
    var payload = {
      nom: name,
      pays: state.coursePays || null,
      par: state.pars.reduce(sum, 0),
      pars_holes: state.pars,
      index_difficulte: state.indexDiff,
      departs: state.departs
    };
    var localCourse = Object.assign({ id: state.selectedCourseId || uid("local"), pars_holes: state.pars.slice() }, payload);
    // update local cache immediately
    var idx = state.courses.findIndex(function (c) { return c.id === localCourse.id; });
    if (idx >= 0) state.courses[idx] = localCourse; else state.courses.push(localCourse);
    saveCache(CACHE_COURSES_KEY, state.courses);
    state.selectedCourseId = localCourse.id;

    if (!state.online) return Promise.resolve(localCourse.id);

    var isRemote = state.selectedCourseId && String(state.selectedCourseId).indexOf("local_") !== 0;
    var req = isRemote
      ? sbPatch("parcours", "id=eq." + state.selectedCourseId, payload).then(function (rows) { return rows[0]; })
      : sbInsert("parcours", [payload]).then(function (rows) { return rows[0]; });

    return req.then(function (row) {
      if (!row) return localCourse.id;
      var remoteCourse = Object.assign({ pars_holes: state.pars.slice() }, row);
      var oldId = localCourse.id;
      var i2 = state.courses.findIndex(function (c) { return c.id === oldId; });
      if (i2 >= 0) state.courses[i2] = remoteCourse; else state.courses.push(remoteCourse);
      saveCache(CACHE_COURSES_KEY, state.courses);
      state.selectedCourseId = row.id;
      return row.id;
    }).catch(function (err) {
      console.error("Erreur de sauvegarde du parcours (restera en local) :", err);
      reportError("Sauvegarde du parcours", err);
      return localCourse.id;
    });
  }
  function saveCurrentCourse() {
    persistCurrentCourse().then(function () {
      state.courseSavedNotice = true;
      render();
      setTimeout(function () { state.courseSavedNotice = false; render(); }, 2200);
    });
  }
  function deleteCourse(id) {
    state.courses = state.courses.filter(function (c) { return c.id !== id; });
    saveCache(CACHE_COURSES_KEY, state.courses);
    if (state.online && String(id).indexOf("local_") !== 0) {
      sbDelete("parcours", "id=eq." + id).catch(function (e) { console.error(e); });
    }
    if (state.selectedCourseId === id) newCourseDraft(); else render();
  }

  // ---------- participants ----------
  function addParticipant() {
    if (state.participants.length >= MAX_PLAYERS) return;
    state.participants.push({ key: uid("p"), joueurId: null, nom: "", genre: "H", index: "", departNom: "" });
    render();
  }
  function removeParticipant(key) {
    if (state.participants.length > 1) {
      state.participants = state.participants.filter(function (p) { return p.key !== key; });
      render();
    }
  }
  function findPlayerByName(name) {
    var n = name.trim().toLowerCase();
    if (!n) return null;
    return state.playersDB.find(function (p) { return p.nom.trim().toLowerCase() === n; }) || null;
  }
  function updateParticipantName(key, value) {
    var p = state.participants.find(function (x) { return x.key === key; });
    if (!p) return;
    p.nom = value;
    var match = findPlayerByName(value);
    if (match) {
      p.joueurId = match.id;
      p.genre = match.genre || p.genre;
      p.index = (match.index_actuel != null) ? String(match.index_actuel) : p.index;
    } else {
      p.joueurId = null;
    }
  }
  function updateParticipantField(key, field, value) {
    var p = state.participants.find(function (x) { return x.key === key; });
    if (!p) return;
    p[field] = value;
    if (field === "genre") {
      var opts = departsForGenre(value);
      if (opts.length && !opts.some(function (d) { return d.nom === p.departNom; })) p.departNom = opts[0].nom;
    }
  }
  function departsForGenre(genre) {
    return state.departs.filter(function (d) { return d.genre === genre; });
  }
  function participantDepart(p) {
    return state.departs.find(function (d) { return d.nom === p.departNom && d.genre === p.genre; }) || departsForGenre(p.genre)[0] || null;
  }
  function participantHcp(p) {
    var d = participantDepart(p);
    if (!d) return null;
    var idxNum = parseFloat(p.index);
    if (isNaN(idxNum)) return null;
    var par = state.pars.reduce(sum, 0);
    return calcCourseHandicap(idxNum, d.cr, d.slope, par);
  }

  // persist players used in this round (create missing ones in Supabase), returns Promise<array of ids parallel to participants>
  function persistParticipantsAsPlayers() {
    return Promise.all(state.participants.map(function (p) {
      var name = p.nom.trim() || "Joueur";
      p.nom = name;
      if (p.joueurId && String(p.joueurId).indexOf("local_") !== 0) {
        // existing remote player: patch index if changed
        if (!state.online) return Promise.resolve(p.joueurId);
        var idxNum = parseFloat(p.index);
        var patch = { genre: p.genre };
        if (!isNaN(idxNum)) patch.index_actuel = idxNum;
        return sbPatch("joueurs", "id=eq." + p.joueurId, patch).then(function (rows) {
          if (rows && rows[0]) {
            var i = state.playersDB.findIndex(function (x) { return x.id === rows[0].id; });
            if (i >= 0) state.playersDB[i] = rows[0]; else state.playersDB.push(rows[0]);
            saveCache(CACHE_PLAYERS_KEY, state.playersDB);
          }
          return p.joueurId;
        }).catch(function (e) { reportError("Mise \u00e0 jour du joueur", e); return p.joueurId; });
      }
      var localPlayer = { id: p.joueurId || uid("local"), nom: name, genre: p.genre, index_actuel: isNaN(parseFloat(p.index)) ? null : parseFloat(p.index) };
      var li = state.playersDB.findIndex(function (x) { return x.id === localPlayer.id; });
      if (li >= 0) state.playersDB[li] = localPlayer; else state.playersDB.push(localPlayer);
      saveCache(CACHE_PLAYERS_KEY, state.playersDB);
      p.joueurId = localPlayer.id;
      if (!state.online) return Promise.resolve(localPlayer.id);
      return sbInsert("joueurs", [{ nom: name, genre: p.genre, index_actuel: localPlayer.index_actuel }]).then(function (rows) {
        var row = rows[0];
        if (row) {
          var i2 = state.playersDB.findIndex(function (x) { return x.id === localPlayer.id; });
          if (i2 >= 0) state.playersDB[i2] = row;
          saveCache(CACHE_PLAYERS_KEY, state.playersDB);
          p.joueurId = row.id;
          return row.id;
        }
        return localPlayer.id;
      }).catch(function (e) { reportError("Cr\u00e9ation du joueur", e); return localPlayer.id; });
    }));
  }

  // ---------- round flow ----------
  function goToPlayScreen() {
    state.savedNotice = false;
    persistCurrentCourse().then(persistParticipantsAsPlayers).then(function () {
      state.scores = state.participants.map(function () { return state.pars.slice(); });
      state.running = false;
      state.currentHole = 0;
      state.holeStart = null;
      state.holeTimes = Array(state.numHoles).fill(null);
      state.elapsed = 0;
      state.playSubview = "hole";
      state.roundInitialized = true;
      state.finishedRound = false;
      state.screen = "play";
      render();
    });
  }
  function startChrono() {
    state.running = true;
    state.currentHole = 0;
    state.holeStart = Date.now();
    state.playSubview = "hole";
    render();
  }
  function adjustScore(pIdx, delta) {
    state.scores[pIdx][state.currentHole] = Math.max(1, state.scores[pIdx][state.currentHole] + delta);
    render();
  }
  function goToHole(idx) {
    if (idx < 0 || idx >= state.numHoles) return;
    var elapsedHole = Math.floor((Date.now() - state.holeStart) / 1000);
    state.holeTimes[state.currentHole] = elapsedHole;
    state.currentHole = idx;
    state.holeStart = Date.now();
    render();
  }
  function editScore(pIdx, holeIdx) {
    var current = state.scores[pIdx][holeIdx];
    var name = state.participants[pIdx].nom;
    var par = state.pars[holeIdx];
    var val = window.prompt("Score de " + name + " au trou " + (holeIdx + 1) + " (par " + par + ") :", String(current));
    if (val === null) return;
    var num = parseInt(val, 10);
    if (!isNaN(num) && num >= 1 && num <= 15) {
      state.scores[pIdx][holeIdx] = num;
      render();
    } else {
      window.alert("Merci d'entrer un score valide (entre 1 et 15).");
    }
  }
  function setDisplayMode(mode) {
    state.displayMode = mode;
    try { localStorage.setItem(DISPLAY_MODE_KEY, mode); } catch (e) {}
    render();
  }

  function computeBreakdownFrom(pars, indexDiff, scores, participants, numHoles, mode) {
    var hasRetour = numHoles > HALF;
    var allerPars = pars.slice(0, Math.min(HALF, numHoles));
    var retourPars = hasRetour ? pars.slice(HALF) : [];
    var allerParTotal = allerPars.reduce(sum, 0);
    var retourParTotal = retourPars.reduce(sum, 0);
    var grandParTotal = allerParTotal + retourParTotal;
    var playersOut = participants.map(function (part, pIdx) {
      var arr = scores[pIdx] || [];
      var hcp = typeof part.hcpDeJeu === "number" ? part.hcpDeJeu : (part.hcp || 0);
      var allerVal = 0, retourVal = 0;
      for (var h = 0; h < Math.min(HALF, numHoles); h++) {
        var r = holeResult(mode, arr[h], hcp, pars[h], indexDiff[h]);
        allerVal += (r.value || 0);
      }
      if (hasRetour) {
        for (var h2 = HALF; h2 < numHoles; h2++) {
          var r2 = holeResult(mode, arr[h2], hcp, pars[h2], indexDiff[h2]);
          retourVal += (r2.value || 0);
        }
      }
      var totalVal = allerVal + retourVal;
      var isStableford = mode === "stableford";
      return {
        name: part.nom,
        allerScore: allerVal, retourScore: retourVal, totalScore: totalVal,
        allerDiff: isStableford ? (18 - allerVal) : (allerVal - allerParTotal),
        retourDiff: hasRetour ? (isStableford ? (18 - retourVal) : (retourVal - retourParTotal)) : null,
        totalDiff: isStableford ? (36 - totalVal) : (totalVal - grandParTotal)
      };
    });
    return { hasRetour: hasRetour, allerParTotal: allerParTotal, retourParTotal: retourParTotal, grandParTotal: grandParTotal, players: playersOut, mode: mode };
  }
  function currentParticipantsWithHcp() {
    return state.participants.map(function (p) {
      return Object.assign({}, p, { hcpDeJeu: participantHcp(p) });
    });
  }
  function computeBreakdown() {
    return computeBreakdownFrom(state.pars, state.indexDiff, state.scores, currentParticipantsWithHcp(), state.numHoles, state.displayMode);
  }
  function rankedPlayers(players, mode) {
    return players.slice().sort(function (a, b) {
      return mode === "stableford" ? (b.totalScore - a.totalScore) : (a.totalScore - b.totalScore);
    });
  }
  function totalsThroughCurrentHole() {
    var mode = state.displayMode;
    var participants = currentParticipantsWithHcp();
    return participants.map(function (part, pIdx) {
      var val = 0;
      for (var h = 0; h <= state.currentHole; h++) {
        var r = holeResult(mode, state.scores[pIdx][h], part.hcpDeJeu, state.pars[h], state.indexDiff[h]);
        val += (r.value || 0);
      }
      var parSoFar = state.pars.slice(0, state.currentHole + 1).reduce(sum, 0);
      var diff = mode === "stableford" ? ((state.currentHole + 1) * 2 - val) : (val - parSoFar);
      return { name: part.nom, totalScore: val, totalDiff: diff };
    });
  }
  function cumulativeSeconds() {
    var finalized = state.holeTimes.reduce(function (a, b) { return a + (b || 0); }, 0);
    var live = state.running && state.holeStart ? Math.floor((Date.now() - state.holeStart) / 1000) : 0;
    return finalized + live;
  }

  function finishRound() {
    var elapsedHole = state.holeStart ? Math.floor((Date.now() - state.holeStart) / 1000) : 0;
    state.holeTimes[state.currentHole] = elapsedHole;
    state.running = false;
    var totalTime = state.holeTimes.reduce(function (a, b) { return a + (b || 0); }, 0);
    state.elapsed = totalTime;
    saveRoundToHistory(totalTime);
    state.finishedRound = true;
    state.screen = "summary";
    render();
  }
  function newGame() {
    state.scores = [];
    state.roundInitialized = false;
    state.finishedRound = false;
    state.running = false;
    state.currentHole = 0;
    state.holeStart = null;
    state.holeTimes = [];
    state.elapsed = 0;
    state.playSubview = "hole";
    state.copied = false;
    state.savedNotice = false;
    state.screen = "config";
    render();
  }

  // ---------- history + Supabase round sync ----------
  function buildRoundPayload(totalTime) {
    var participants = currentParticipantsWithHcp();
    return {
      id: uid("round"),
      date: new Date().toISOString(),
      courseId: state.selectedCourseId,
      courseName: state.courseName || "Parcours sans nom",
      coursePays: state.coursePays,
      numHoles: state.numHoles,
      pars: state.pars.slice(),
      indexDiff: state.indexDiff.slice(),
      participants: participants.map(function (p) {
        return { joueurId: p.joueurId, nom: p.nom, genre: p.genre, index: p.index, departNom: p.departNom, hcpDeJeu: p.hcpDeJeu };
      }),
      scores: state.scores.map(function (r) { return r.slice(); }),
      holeTimes: state.holeTimes.slice(),
      totalTime: totalTime
    };
  }
  function saveRoundToHistory(totalTime) {
    try {
      var round = buildRoundPayload(totalTime);
      var existing = loadHistoryList();
      existing.push(round);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(existing));
      state.history = existing;
      state.savedNotice = true;
    } catch (e) {
      console.error("Erreur de sauvegarde locale de la partie :", e);
      state.savedNotice = false;
    }
    pushRoundToSupabase(round);
  }
  function pushRoundToSupabase(round) {
    if (!state.online) { enqueueSync(round); return; }
    syncOneRound(round).catch(function (e) {
      console.error("Synchronisation Supabase \u00e9chou\u00e9e, mise en file :", e);
      reportError("Synchronisation de la partie", e);
      enqueueSync(round);
    });
  }
  function syncOneRound(round) {
    return sbInsert("parties", [{
      date: round.date,
      parcours_id: (round.courseId && String(round.courseId).indexOf("local_") !== 0) ? round.courseId : null,
      temps_total_secondes: round.totalTime
    }]).then(function (rows) {
      var partie = rows[0];
      var pjRows = round.participants.map(function (p) {
        return {
          partie_id: partie.id,
          joueur_id: (p.joueurId && String(p.joueurId).indexOf("local_") !== 0) ? p.joueurId : null,
          depart_choisi: p.departNom,
          index_du_jour: isNaN(parseFloat(p.index)) ? null : parseFloat(p.index),
          hcp_de_jeu: p.hcpDeJeu
        };
      });
      var scoreRows = [];
      round.participants.forEach(function (p, pIdx) {
        for (var h = 0; h < round.numHoles; h++) {
          scoreRows.push({
            partie_id: partie.id,
            joueur_id: (p.joueurId && String(p.joueurId).indexOf("local_") !== 0) ? p.joueurId : null,
            trou: h + 1,
            coups: round.scores[pIdx][h],
            temps_secondes: round.holeTimes[h]
          });
        }
      });
      return Promise.all([
        sbInsert("parties_joueurs", pjRows),
        sbInsert("scores", scoreRows)
      ]);
    });
  }
  function enqueueSync(round) {
    var q = loadSyncQueue();
    q.push(round);
    saveSyncQueue(q);
    state.pendingCount = q.length;
  }
  function flushSyncQueue() {
    if (!state.online || state.syncing) return;
    var q = loadSyncQueue();
    if (!q.length) return;
    state.syncing = true;
    render();
    var remaining = q.slice();
    function next() {
      if (!remaining.length) {
        saveSyncQueue([]);
        state.pendingCount = 0;
        state.syncing = false;
        render();
        if (state.screen === "history") fetchHistoryFromSupabase();
        return;
      }
      var round = remaining[0];
      syncOneRound(round).then(function () {
        remaining.shift();
        saveSyncQueue(remaining);
        state.pendingCount = remaining.length;
        next();
      }).catch(function (e) {
        console.error("\u00c9chec de synchronisation diff\u00e9r\u00e9e, on r\u00e9essaiera plus tard :", e);
        reportError("Synchronisation diff\u00e9r\u00e9e", e);
        state.syncing = false;
        render();
      });
    }
    next();
  }
  function openHistory() {
    state.history = loadHistoryList();
    state.screen = "history";
    render();
    fetchHistoryFromSupabase();
  }
  function transformRemoteRound(row) {
    var pc = row.parcours || {};
    var numHoles = (pc.index_difficulte && pc.index_difficulte.length) || (pc.pars_holes && pc.pars_holes.length) || 18;
    var pars = pc.pars_holes || Array(numHoles).fill(DEFAULT_PAR);
    var indexDiff = pc.index_difficulte || Array.from({ length: numHoles }, function (_, i) { return i + 1; });
    var pjRows = row.parties_joueurs || [];
    var participants = pjRows.map(function (pj) {
      var j = pj.joueurs || {};
      return { joueurId: j.id, nom: j.nom || "Joueur", genre: j.genre || "H", index: pj.index_du_jour, departNom: pj.depart_choisi, hcpDeJeu: pj.hcp_de_jeu };
    });
    if (!participants.length) return null;
    var scoresRows = row.scores || [];
    var scores = participants.map(function (p) {
      var arr = Array(numHoles).fill(0);
      scoresRows.filter(function (s) { return s.joueur_id === p.joueurId; }).forEach(function (s) {
        if (s.trou >= 1 && s.trou <= numHoles) arr[s.trou - 1] = s.coups;
      });
      return arr;
    });
    var holeTimes = Array(numHoles).fill(null);
    scoresRows.forEach(function (s) {
      if (s.trou >= 1 && s.trou <= numHoles && s.temps_secondes != null) holeTimes[s.trou - 1] = s.temps_secondes;
    });
    return {
      id: "remote_" + row.id,
      remotePartieId: row.id,
      date: row.date,
      courseName: pc.nom || "Parcours",
      coursePays: pc.pays,
      numHoles: numHoles,
      pars: pars,
      indexDiff: indexDiff,
      participants: participants,
      scores: scores,
      holeTimes: holeTimes,
      totalTime: row.temps_total_secondes
    };
  }
  function fetchHistoryFromSupabase() {
    if (!state.online) return Promise.resolve();
    var query = "select=*,parcours(nom,pays,par,pars_holes,index_difficulte),parties_joueurs(depart_choisi,index_du_jour,hcp_de_jeu,joueurs(id,nom,genre)),scores(joueur_id,trou,coups,temps_secondes)&order=date.desc&limit=200";
    return sbSelect("parties", query).then(function (rows) {
      var remoteHistory = rows.map(transformRemoteRound).filter(Boolean);
      if (remoteHistory.length || (rows && rows.length === 0)) {
        state.history = remoteHistory;
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(remoteHistory)); } catch (e) {}
      }
      if (state.screen === "history") render();
    }).catch(function (e) {
      console.error("Erreur de chargement de l'historique distant (on garde la copie locale) :", e);
      reportError("Chargement de l'historique", e);
    });
  }
  function historyDisplayList() {
    var pending = loadSyncQueue().map(function (r) { return Object.assign({}, r, { pendingSync: true }); });
    return pending.concat(state.history);
  }
  function deleteHistoryItem(id) {
    var pendingQueue = loadSyncQueue();
    var wasPending = pendingQueue.some(function (r) { return r.id === id; });
    if (wasPending) {
      saveSyncQueue(pendingQueue.filter(function (r) { return r.id !== id; }));
      state.pendingCount = loadSyncQueue().length;
    }
    try {
      var existing = loadHistoryList().filter(function (r) { return r.id !== id; });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(existing));
    } catch (e) { console.error("Erreur de suppression locale :", e); }
    var item = state.history.find(function (r) { return r.id === id; });
    state.history = state.history.filter(function (r) { return r.id !== id; });
    render();
    if (item && item.remotePartieId && state.online) {
      sbDelete("parties", "id=eq." + item.remotePartieId).catch(function (e) { console.error("Erreur de suppression distante :", e); });
    }
  }

  // ---------- CSV export ----------
  function exportHistoryCsv() {
    var rows = [["Date", "Parcours", "Pays", "Joueur", "Genre", "Depart", "Index", "Hcp de jeu", "Total brut", "Temps total (s)"]];
    historyDisplayList().forEach(function (item) {
      item.participants.forEach(function (p, pIdx) {
        var totalBrut = (item.scores[pIdx] || []).reduce(sum, 0);
        rows.push([
          item.date, item.courseName, item.coursePays || "", p.nom, p.genre, p.departNom || "",
          p.index || "", p.hcpDeJeu != null ? p.hcpDeJeu : "", totalBrut, item.totalTime
        ]);
      });
    });
    var csv = rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "golf-historique-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    markBackupDone();
    render();
  }

  // ---------- share ----------
  function buildRecapText(courseName, numHoles, pars, indexDiff, scores, participants, holeTimesArr, totalTime, dateStr, mode) {
    var b = computeBreakdownFrom(pars, indexDiff, scores, participants, numHoles, mode);
    holeTimesArr = holeTimesArr || [];
    var allerTime = sumRange(holeTimesArr, 0, Math.min(HALF, numHoles));
    var retourTime = b.hasRetour ? sumRange(holeTimesArr, HALF, numHoles) : 0;
    var ranked = rankedPlayers(b.players, mode);
    var modeLabel = mode === "brut" ? "Brut" : (mode === "net" ? "Net" : "Stableford");
    var lines = ["\u26F3 " + (courseName || "R\u00e9sultats") + " \u2014 " + numHoles + " trous (" + modeLabel + ")" + (dateStr ? " (" + dateStr + ")" : "")];
    lines.push("");
    lines.push("Classement :");
    ranked.forEach(function (r, i) {
      lines.push((i + 1) + ". " + r.name + " : " + r.totalScore + (mode === "stableford" ? " pts" : " (" + diffLabel(r.totalDiff) + ")") +
        (b.hasRetour ? "  [Aller " + r.allerScore + " \u00b7 Retour " + r.retourScore + "]" : ""));
    });
    lines.push("");
    lines.push("D\u00e9tail par trou (" + modeLabel + ") :");
    function holeLine(h) {
      var par = pars[h];
      var parts = participants.map(function (part, pIdx) {
        var r = holeResult(mode, (scores[pIdx] || [])[h], part.hcpDeJeu, par, indexDiff[h]);
        return part.nom + " " + r.value;
      });
      return "Trou " + (h + 1) + " (par " + par + ") \u2014 " + parts.join(", ");
    }
    lines.push("Aller (1-9) :");
    for (var h = 0; h < Math.min(HALF, numHoles); h++) lines.push(holeLine(h));
    lines.push("Total aller : " + b.allerParTotal + " (par) \u00b7 " + formatTime(allerTime));
    if (b.hasRetour) {
      lines.push("");
      lines.push("Retour (10-18) :");
      for (var h2 = HALF; h2 < numHoles; h2++) lines.push(holeLine(h2));
      lines.push("Total retour : " + b.retourParTotal + " (par) \u00b7 " + formatTime(retourTime));
    }
    lines.push("");
    lines.push("Temps total : " + formatTime(totalTime));
    return lines.join("\n");
  }
  function shareText(text) {
    if (navigator.share) {
      navigator.share({ title: "R\u00e9sultats de golf", text: text }).catch(function () {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        state.copied = true; render();
        setTimeout(function () { state.copied = false; render(); }, 2500);
      }).catch(function () { window.prompt("Copie manuelle (Cmd/Ctrl+C) :", text); });
    } else {
      window.prompt("Copie manuelle (Cmd/Ctrl+C) :", text);
    }
  }
  function shareResults() {
    var participants = currentParticipantsWithHcp();
    var text = buildRecapText(state.courseName, state.numHoles, state.pars, state.indexDiff, state.scores, participants, state.holeTimes, state.elapsed, null, state.displayMode);
    shareText(text);
  }
  function shareHistoryItem(id) {
    var item = historyDisplayList().find(function (r) { return r.id === id; });
    if (!item) return;
    var text = buildRecapText(item.courseName, item.numHoles, item.pars, item.indexDiff, item.scores, item.participants, item.holeTimes || [], item.totalTime, formatDate(item.date), state.displayMode);
    shareText(text);
  }

  // ---------- timer ----------
  function startTimerTick() {
    updateTimerDisplay();
    timerInterval = setInterval(updateTimerDisplay, 1000);
  }
  function updateTimerDisplay() {
    if (!state.running || !state.holeStart) return;
    var holeElapsed = Math.floor((Date.now() - state.holeStart) / 1000);
    var cumul = state.holeTimes.reduce(function (a, b) { return a + (b || 0); }, 0) + holeElapsed;
    var elHole = document.getElementById("holeTimerDisplay");
    if (elHole) elHole.textContent = formatTime(holeElapsed);
    var elCumul = document.getElementById("cumulTimerDisplay");
    if (elCumul) elCumul.textContent = formatTime(cumul);
    var elCumul2 = document.getElementById("cumulTimerDisplay2");
    if (elCumul2) elCumul2.textContent = formatTime(cumul);
  }

    var app = document.getElementById("app");
    clearInterval(timerInterval);
    if (state.screen === "config") app.innerHTML = renderConfig();
    else if (state.screen === "play") { app.innerHTML = renderPlay(); if (state.running) startTimerTick(); }
    else if (state.screen === "history") app.innerHTML = renderHistory();

      return '<div class="row between" style="margin-bottom:6px;font-size:14px;">' +
        '<span class="row"><span class="rank-num ' + (i === 0 ? "first" : "") + '">' + (i + 1) + '</span>' +
        '<span class="rank-name">' + escapeHtml(r.name) + '</span></span>' +
        '<span class="rank-score">' + r.totalScore + (state.displayMode === "stableford" ? " pts" : " coups <span style=\"color:var(--stone-400);font-weight:400;\">(" + diffLabel(r.totalDiff) + ")</span>") + '</span></div>';
    }).join("");

    return renderTabs("play") + header + modeBarHtml() + subnav +
      '<div class="header-bar">' +
      '<div class="row between">' +
      '<div class="row gap2">' +
      '<button class="hole-nav-btn" data-action="prev-hole" ' + (state.currentHole === 0 ? "disabled" : "") + '>\u2039</button>' +
      '<div><div class="hb-label">Trou</div><div class="hb-value">' + (state.currentHole + 1) + ' / ' + state.numHoles + '</div></div>' +
      '</div>' +
      '<div style="text-align:right;"><div class="hb-label">Par \u00b7 Idx</div><div class="hb-value">' + state.pars[state.currentHole] + ' \u00b7 ' + state.indexDiff[state.currentHole] + '</div></div>' +
      '</div>' +
      '<div class="timer-row">' +
      '<div class="timer-box"><div class="tb-label">Ce trou</div><div class="tb-value" id="holeTimerDisplay">00:00</div></div>' +
      '<div class="timer-box"><div class="tb-label">Cumul\u00e9</div><div class="tb-value" id="cumulTimerDisplay">' + formatTime(cumulativeSeconds()) + '</div></div>' +
      '</div>' +
      '</div>' +
      playersHtml +
      '<div class="card" style="margin-top:8px;"><h2>\u{1F3C6} Classement</h2>' + rankHtml + '</div>' +
      '<button class="link-btn" data-action="show-table-view" style="margin-bottom:12px;">\u{1F4CB} Voir la carte de score compl\u00e8te</button>' +
      '<button class="btn-primary" data-action="' + (isLast ? "finish-round" : "next-hole") + '">' + (isLast ? "Terminer la partie" : "Trou suivant") + ' \u203A</button>';
  }

  function renderSummary() {
    var participants = currentParticipantsWithHcp();
    var b = computeBreakdownFrom(state.pars, state.indexDiff, state.scores, participants, state.numHoles, state.displayMode);
    var ranked = rankedPlayers(b.players, state.displayMode);
    var isSolo = state.participants.length === 1;
    var table = scoreTableHtml(false);

    var rankHtml = ranked.map(function (r, i) {
      return '<div class="row between" style="margin-bottom:8px;">' +
        '<span class="row"><span class="rank-num ' + (i === 0 ? "first" : "") + '">' + (i + 1) + '</span>' +
        '<span class="rank-name">' + escapeHtml(r.name) + '</span></span>' +
        '<span class="rank-score">' + r.totalScore + (state.displayMode === "stableford" ? " pts" : " coups (" + diffLabel(r.totalDiff) + ")") + '</span></div>';
    }).join("");

    return '' +
      modeBarHtml() + errorBannerHtml() +
      '<div class="row gap2"><span style="font-size:24px;">\u{1F3C6}</span><h1>Partie termin\u00e9e</h1></div>' +
      '<p class="sub" style="margin-bottom:4px;">' + escapeHtml(state.courseName || "") + '</p>' +
      '<p class="sub" style="margin-bottom:4px;">' +
      (isSolo ? "Bravo. \u2014 Belle partie d'entra\u00eenement !" :
        "Bravo \u00e0 tous \u2014 " + escapeHtml(ranked[0].name) + " l'emporte avec " + ranked[0].totalScore + (state.displayMode === "stableford" ? " pts" : " coups") + " !") +
      '</p>' +
      (state.savedNotice ? '<p class="saved-notice">\u2713 Partie enregistr\u00e9e (' + (state.online ? "synchronis\u00e9e avec Supabase" : "en attente de synchronisation") + ')</p>' : '<div style="margin-bottom:20px;"></div>') +
      '<div class="card"><h2>Classement final</h2>' + rankHtml + '</div>' +
      '<div class="card">' + table + '</div>' +
      '<div class="total-time-row"><span>\u23F1 Temps total de jeu</span><span style="font-family:monospace;font-weight:700;">' + formatTime(state.elapsed) + '</span></div>' +
      '<button class="btn-outline" data-action="share-results">' + (state.copied ? "\u2713 Copi\u00e9 dans le presse-papiers !" : "\u{1F4E4} Partager les r\u00e9sultats") + '</button>' +
      '<button class="btn-primary" data-action="new-game">\u21BA Nouvelle partie</button>';
  }

  function renderHistory() {
    var itemsHtml;
    var list = historyDisplayList();
    if (list.length === 0) {
      itemsHtml = '<div class="empty-state">Aucune partie enregistr\u00e9e pour l\'instant.</div>';
    } else {
      itemsHtml = list.map(function (item) {
        var hasRetour = item.numHoles > HALF;
        var holeTimesArr = item.holeTimes || [];
        var allerTime = sumRange(holeTimesArr, 0, Math.min(HALF, item.numHoles));
        var retourTime = hasRetour ? sumRange(holeTimesArr, HALF, item.numHoles) : 0;
        var b = computeBreakdownFrom(item.pars, item.indexDiff, item.scores, item.participants, item.numHoles, state.displayMode);
        var sortedTotals = rankedPlayers(b.players, state.displayMode);
        var playersHtml = sortedTotals.map(function (t, i) {
          var detail = hasRetour ? 'Aller ' + t.allerScore + ' \u00b7 Retour ' + t.retourScore : '';
          return '<div class="hist-player-row" style="align-items:flex-start;">' +
            '<span class="hp-name">' + (i + 1) + '. ' + escapeHtml(t.name) + (detail ? '<div style="font-size:11px;color:var(--stone-400);font-weight:400;">' + detail + '</div>' : '') + '</span>' +
            '<span class="hp-score">' + t.totalScore + (state.displayMode === "stableford" ? " pts" : " coups <span class=\"hp-diff\">(" + diffLabel(t.totalDiff) + ")</span>") + '</span>' +
            '</div>';
        }).join("");
        var totalTime = item.totalTime != null ? formatTime(item.totalTime) : "\u2013";
        var timeDetail = hasRetour ? (' (\u26F3 ' + formatTime(allerTime) + ' / ' + formatTime(retourTime) + ')') : '';
        var pendingTag = item.pendingSync ? ' <span class="sync-pill sync-pending" style="margin-left:6px;">en attente</span>' : '';
        return '<div class="history-item">' +
          '<div class="hist-top"><div>' +
          '<div class="course-name">' + escapeHtml(item.courseName || "Parcours") + pendingTag + '</div>' +
          '<div class="date">' + formatDate(item.date) + ' \u00b7 ' + item.numHoles + ' trous \u00b7 \u23F1 ' + totalTime + timeDetail + '</div>' +
          '</div>' +
          '<div class="row gap2">' +
          '<button class="icon-btn" data-action="share-history" data-id="' + item.id + '" aria-label="Partager">\u{1F4E4}</button>' +
          '<button class="icon-btn" data-action="delete-history" data-id="' + item.id + '" aria-label="Supprimer">\u{1F5D1}</button>' +
          '</div></div>' +
          '<div class="hist-players">' + playersHtml + '</div>' +
          '</div>';
      }).join("");
    }
    return '<div class="row gap2" style="margin-bottom:14px;">' +
      '<button class="icon-btn" data-action="back-config" aria-label="Retour">\u2039</button>' +
      '<h1 style="font-size:18px;">Historique des parties</h1></div>' +
      errorBannerHtml() +
      modeBarHtml() +
      (list.length ? '<button class="btn-outline" data-action="export-csv">\u{1F4E5} Exporter en CSV</button>' : '') +
      itemsHtml;
  }

  // ---------- event delegation ----------
  var app = document.getElementById("app");
  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-action]");
    if (!t || t.disabled) return;
    var action = t.dataset.action;
    if (action === "select-course") selectCourse(t.dataset.id);
    else if (action === "delete-course") deleteCourse(t.dataset.id);
    else if (action === "new-course-draft") newCourseDraft();
    else if (action === "set-holes") setHoleCount(Number(t.dataset.holes));
    else if (action === "update-par") updatePar(Number(t.dataset.index), Number(t.dataset.delta));
    else if (action === "update-idx") updateIndexDiff(Number(t.dataset.index), Number(t.dataset.delta));
    else if (action === "add-depart") addDepart();
    else if (action === "remove-depart") removeDepart(Number(t.dataset.index));
    else if (action === "save-course") saveCurrentCourse();
    else if (action === "add-participant") addParticipant();
    else if (action === "remove-participant") removeParticipant(t.dataset.key);
    else if (action === "go-to-play") goToPlayScreen();
    else if (action === "go-config") { state.screen = "config"; render(); }
    else if (action === "go-play") { if (state.roundInitialized) { state.screen = state.finishedRound ? "summary" : "play"; render(); } }
    else if (action === "back-config") { state.screen = "config"; render(); }
    else if (action === "open-history") openHistory();
    else if (action === "delete-history") deleteHistoryItem(t.dataset.id);
    else if (action === "share-history") shareHistoryItem(t.dataset.id);
    else if (action === "export-csv") exportHistoryCsv();
    else if (action === "clear-error") clearError();
    else if (action === "edit-score") editScore(Number(t.dataset.player), Number(t.dataset.hole));
    else if (action === "adjust-score") adjustScore(Number(t.dataset.player), Number(t.dataset.delta));
    else if (action === "prev-hole") goToHole(state.currentHole - 1);
    else if (action === "next-hole") goToHole(state.currentHole + 1);
    else if (action === "show-hole-view") { state.playSubview = "hole"; render(); }
    else if (action === "show-table-view") { state.playSubview = "table"; render(); }
    else if (action === "start-chrono") startChrono();
    else if (action === "finish-round") finishRound();
    else if (action === "share-results") shareResults();
    else if (action === "new-game") newGame();
  });
  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.matches(".course-name-input")) state.courseName = el.value;
    else if (el.matches(".course-pays-input")) state.coursePays = el.value;
    else if (el.matches(".depart-nom-input")) updateDepartField(Number(el.dataset.index), "nom", el.value);
    else if (el.matches(".depart-cr-input")) updateDepartField(Number(el.dataset.index), "cr", el.value);
    else if (el.matches(".depart-slope-input")) updateDepartField(Number(el.dataset.index), "slope", el.value);
    else if (el.matches(".participant-name-input")) updateParticipantName(el.dataset.key, el.value);
    else if (el.matches(".participant-index-input")) updateParticipantField(el.dataset.key, "index", el.value);
  });
  app.addEventListener("change", function (e) {
    var el = e.target;
    if (el.matches(".depart-genre-input")) { updateDepartField(Number(el.dataset.index), "genre", el.value); render(); }
    else if (el.matches(".participant-genre-input")) { updateParticipantField(el.dataset.key, "genre", el.value); render(); }
    else if (el.matches(".participant-depart-input")) { updateParticipantField(el.dataset.key, "departNom", el.value); render(); }
    else if (el.matches(".mode-select")) setDisplayMode(el.value);
  });

  window.addEventListener("online", function () { state.online = true; flushSyncQueue(); render(); });
  window.addEventListener("offline", function () { state.online = false; render(); });

  // ---------- initial load: refresh caches from Supabase, then render ----------
  function bootstrap() {
    render();
    if (!state.online) return;
    Promise.all([
      sbSelect("parcours", "select=*&order=nom.asc").catch(function (e) { reportError("Chargement des parcours", e); return null; }),
      sbSelect("joueurs", "select=*&order=nom.asc").catch(function (e) { reportError("Chargement des joueurs", e); return null; })
    ]).then(function (results) {
      var coursesRemote = results[0], playersRemote = results[1];
      if (coursesRemote) {
        state.courses = coursesRemote.map(function (c) {
          var nHoles = (c.index_difficulte && c.index_difficulte.length) || (c.pars_holes && c.pars_holes.length) || 18;
          return Object.assign({ pars_holes: c.pars_holes || Array(nHoles).fill(DEFAULT_PAR) }, c);
        });
        saveCache(CACHE_COURSES_KEY, state.courses);
      }
      if (playersRemote) {
        state.playersDB = playersRemote;
        saveCache(CACHE_PLAYERS_KEY, state.playersDB);
      }
      render();
      flushSyncQueue();
    });
  }
  bootstrap();
})();

</script>
</body>
</html>
