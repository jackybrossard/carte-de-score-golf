<title>Chrono Parcours</title>
<style>
  :root {
    --emerald-900:#064e3b; --emerald-800:#065f46; --emerald-700:#047857; --emerald-50:#ecfdf5;
    --amber-400:#fbbf24; --amber-100:#fef3c7; --amber-800:#92400e;
    --rose-100:#ffe4e6; --rose-200:#fecdd3; --rose-700:#be123c; --rose-600:#e11d48;
    --stone-50:#fafaf9; --stone-100:#f5f5f4; --stone-200:#e7e5e4; --stone-300:#d6d3d1;
    --stone-400:#a8a29e; --stone-500:#78716c; --stone-600:#57534e; --stone-700:#44403c;
    --stone-800:#292524; --stone-900:#1c1917;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--stone-100); color:var(--stone-800); }
  .wrap { max-width:480px; margin:0 auto; padding:16px 16px 48px; min-height:100vh; }
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }
  .gap2 { gap:8px; }
  h1 { font-size:22px; font-weight:800; color:var(--emerald-900); margin:0; letter-spacing:-0.01em; }
  h2 { font-size:13px; font-weight:700; color:var(--stone-700); margin:0 0 10px; }
  p.sub { color:var(--stone-500); font-size:12px; margin:2px 0 16px; }
  .card { background:#fff; border:1px solid var(--stone-200); border-radius:14px; padding:13px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
  input[type=text] { width:100%; border:1px solid var(--stone-300); border-radius:9px; padding:9px 11px; font-size:14px; color:var(--stone-800); background:#fff; }
  input:focus { outline:none; border-color:var(--emerald-700); box-shadow:0 0 0 2px rgba(4,120,87,0.15); }
  .icon-btn { width:36px; height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:10px; background:var(--stone-100); border:none; color:var(--stone-500); font-size:16px; cursor:pointer; }
  .icon-btn:active { background:var(--rose-100); color:var(--rose-600); }

  // ---------- history + Supabase sync ----------

  function exportHistoryItemCsv(item) {
    try { shareOrDownloadCsv(rowsToCsv(sessionCsvRows(item)), "chrono-" + (item.libelle || "sortie").replace(/[^a-z0-9]+/gi, "-") + ".csv"); }
    catch (e) { reportError("Export CSV", e); }
  }
  function buildRecapText(session) {
    var last = session.tops[session.tops.length - 1];
    var lines = ["\u23F1 " + (session.libelle || "Sortie") + " \u2014 " + formatDateFr(session.dateDebut)];
    lines.push("");
    session.tops.forEach(function (t) {
      lines.push(t.ordre + ". " + t.libelle + " \u2014 " + formatClock(t.heure) + " (+" + formatTime(t.dureeSecondes) + ") \u2014 " + formatDistance(t.distCumulative) + " parcourus, " + formatDistance(t.distVolOiseau) + " \u00e0 vol d'oiseau");
    });
    lines.push("");
    lines.push("Dur\u00e9e totale : " + formatTime(session.dureeTotale));
    lines.push("Distance totale : " + formatDistance(last.distCumulative) + " \u00b7 Vol d'oiseau : " + formatDistance(last.distVolOiseau));
    return lines.join("\n");
  }
  function shareText(text) {
    if (navigator.share) { navigator.share({ title: "Chrono Parcours", text: text }).catch(function () {}); }
    else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        state.copied = true; render();
        setTimeout(function () { state.copied = false; render(); }, 2500);
      }).catch(function () { window.prompt("Copie manuelle (Cmd/Ctrl+C) :", text); });
    } else { window.prompt("Copie manuelle (Cmd/Ctrl+C) :", text); }
  }
  function shareCurrentSession() { shareText(buildRecapText(buildSessionPayload())); }
  function shareHistoryItem(id) {
    var item = historyDisplayList().find(function (r) { return r.id === id; });
    if (item) shareText(buildRecapText(item));
  }

  // ---------- timer ----------
  function startTimerTick() { updateTimerDisplay(); timerInterval = setInterval(updateTimerDisplay, 1000); }
  function updateTimerDisplay() {
    if (!state.running) return;
    var elTotal = document.getElementById("totalTimerDisplay");
    if (elTotal) elTotal.textContent = formatTime(totalDuration());
    var elSince = document.getElementById("sinceTopDisplay");
    if (elSince) elSince.textContent = formatTime(sinceLastTopSeconds());
  }

  // ---------- render ----------
  function render() {
    var app = document.getElementById("app");
    clearInterval(timerInterval);
    if (state.screen === "live") { app.innerHTML = renderLive(); if (state.running) startTimerTick(); }
    else if (state.screen === "summary") app.innerHTML = renderSummary();
    else app.innerHTML = renderHistory();
  }

  function errorBannerHtml() {
    if (!state.lastSyncError) return "";
    return '<div class="warn-banner" style="background:var(--rose-100);border-color:var(--rose-200);color:var(--rose-700);">' +
      '<span>\u26A0\uFE0F ' + escapeHtml(state.lastSyncError) + '</span>' +
      '<button class="link-btn" style="padding:0;color:var(--rose-700);" data-action="clear-error">\u2715</button></div>';
  }
  function syncPillHtml() {
    if (!state.online) return '<span class="sync-pill sync-offline">\u26AB Hors ligne</span>';
    if (state.syncing) return '<span class="sync-pill sync-pending">\u21BB Synchro\u2026</span>';
    if (state.pendingCount > 0) return '<span class="sync-pill sync-pending">' + state.pendingCount + ' en attente</span>';
    return '<span class="sync-pill sync-online">\u2713 Synchronis\u00e9</span>';
  }

  function topsTableHtml(tops, editable) {
    var rows = tops.map(function (t) {
      var labelCell = editable
        ? '<input type="text" class="top-label-input" data-id="' + t.id + '" value="' + escapeHtml(t.label) + '">'
        : escapeHtml(t.label);
      return "<tr><td>" + t.ordre + "</td><td>" + formatClock(t.time || t.heure) + '</td><td class="label-cell">' + labelCell + "</td><td>" + formatTime(t.durationSec != null ? t.durationSec : t.dureeSecondes) + "</td><td>" + formatDistance(t.distCumulative) + "</td><td>" + formatDistance(t.distVolOiseau) + "</td></tr>";
    }).join("");
    return '<div class="table-scroll"><table class="top-table"><thead><tr><th>#</th><th>Heure</th><th style="text-align:left;">Libell\u00e9</th><th>Dur\u00e9e</th><th>Parcourue</th><th>Vol d\u2019oiseau</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderLive() {
    var syncRow = '<div class="row between no-print" style="margin-bottom:14px;">' + syncPillHtml() + '<button class="icon-btn" data-action="open-history" aria-label="Historique">\u{1F551}</button></div>';
    var header = '<div class="row gap2" style="margin-bottom:1px;"><span style="font-size:24px;">\u23F1</span><h1>Chrono Parcours</h1></div>' +
      '<p class="sub">' + formatDateFr(new Date().toISOString()) + '</p>' + errorBannerHtml();

    if (!state.running) {
      return syncRow + header +
        '<div class="card">' +
        '<h2>Nom de la sortie (optionnel)</h2>' +
        '<input type="text" class="libelle-input" value="' + escapeHtml(state.libelle) + '" placeholder="ex. Randonn\u00e9e Dolomites">' +
        (state.geoAvailable ? '' : '<p class="sub" style="margin:8px 0 0;color:var(--amber-800);">\u26A0\uFE0F G\u00e9olocalisation non disponible sur cet appareil \u2014 les distances ne seront pas calcul\u00e9es.</p>') +
        '</div>' +
        '<button class="btn-big" data-action="start-session">\u25B6 D\u00e9marrer</button>';
    }

    var tableHtml = state.tops.length ? topsTableHtml(state.tops, true) :
      '<div class="empty-state">Appuie sur \u00ab\u00a0Top Chrono\u00a0\u00bb pour enregistrer ton premier point.</div>';
    var pauseBtn = state.paused
      ? '<button class="btn-primary no-print" data-action="toggle-pause" style="margin-bottom:14px;background:var(--amber-800);">\u25B6 Reprendre</button>'
      : '<button class="btn-outline no-print" data-action="toggle-pause" style="margin-bottom:14px;">\u23F8 Pause</button>';
    return syncRow + header +
      '<div class="chrono-panel">' +
      (state.paused ? '<div class="chrono-label" style="color:var(--amber-400);">\u23F8 EN PAUSE</div>' : '<div class="chrono-label">Depuis le dernier top</div>') +
      '<div class="chrono-big" id="sinceTopDisplay">' + formatTime(sinceLastTopSeconds()) + '</div>' +
      '<div class="chrono-sub" id="totalTimerDisplay">Total : ' + formatTime(totalDuration()) + '</div>' +
      '</div>' +
      '<button class="btn-big no-print" data-action="add-top" style="margin-bottom:10px;" ' + (state.paused ? "disabled" : "") + '>\u23F1 Top Chrono</button>' +
      '<p class="sub no-print" style="text-align:center;margin:0 0 14px;">Heure de d\u00e9part : ' + formatClock(new Date(state.startTime).toISOString()) + '</p>' +
      pauseBtn +
      '<div class="card">' + tableHtml + '</div>' +
      '<button class="btn-primary no-print" data-action="finish-session">Terminer \u203A</button>';
  }

  function renderSummary() {
    var session = buildSessionPayload();
    var last = state.tops[state.tops.length - 1];
    return '<div class="row gap2 no-print" style="margin-bottom:1px;"><span style="font-size:24px;">\u2705</span><h1>Sortie termin\u00e9e</h1></div>' +
      '<p class="sub">' + escapeHtml(state.libelle || "Sortie sans nom") + ' \u2014 ' + formatDateFr(session.dateDebut) + '</p>' +
      errorBannerHtml() +
      (state.savedNotice ? '<p class="saved-notice">\u2713 Sortie enregistr\u00e9e (' + (state.online ? "synchronis\u00e9e avec Supabase" : "en attente de synchronisation") + ')</p>' : '') +
      '<div class="total-time-row"><span>\u23F1 Dur\u00e9e totale</span><span style="font-family:monospace;font-weight:700;">' + formatTime(session.dureeTotale) + '</span></div>' +
      '<div class="total-time-row"><span>\u{1F463} Distance parcourue</span><span style="font-family:monospace;font-weight:700;">' + formatDistance(last.distCumulative) + '</span></div>' +
      '<div class="total-time-row"><span>\u{1F426} Vol d\u2019oiseau</span><span style="font-family:monospace;font-weight:700;">' + formatDistance(last.distVolOiseau) + '</span></div>' +
      '<div class="card">' + topsTableHtml(state.tops, false) + '</div>' +
      '<button class="btn-outline" data-action="share-current">' + (state.copied ? "\u2713 Copi\u00e9 dans le presse-papiers !" : "\u{1F4E4} Partager") + '</button>' +
      '<button class="btn-outline" data-action="export-current-csv">\u{1F4E5} Exporter en CSV</button>' +
      '<button class="btn-primary" data-action="new-session">\u21BA Nouvelle sortie</button>';
  }

  function renderHistoryDetailScreen(item) {
    var last = item.tops[item.tops.length - 1];
    return '<div class="row gap2 no-print" style="margin-bottom:14px;">' +
      '<button class="icon-btn" data-action="close-history-detail" aria-label="Retour">\u2039</button>' +
      '<h1 style="font-size:18px;">' + escapeHtml(item.libelle || "Sortie") + '</h1></div>' +
      '<p class="sub no-print" style="margin-bottom:12px;">' + formatDateFr(item.dateDebut) + '</p>' +
      errorBannerHtml() +
      '<div class="total-time-row"><span>\u23F1 Dur\u00e9e totale</span><span style="font-family:monospace;font-weight:700;">' + formatTime(item.dureeTotale) + '</span></div>' +
      '<div class="total-time-row"><span>\u{1F463} Distance parcourue</span><span style="font-family:monospace;font-weight:700;">' + formatDistance(last.distCumulative) + '</span></div>' +
      '<div class="total-time-row"><span>\u{1F426} Vol d\u2019oiseau</span><span style="font-family:monospace;font-weight:700;">' + formatDistance(last.distVolOiseau) + '</span></div>' +
      '<div class="card">' + topsTableHtml(item.tops, false) + '</div>' +
      '<button class="btn-outline no-print" data-action="print-history-detail">\u{1F5A8}\uFE0F Imprimer</button>' +
      '<button class="btn-outline no-print" data-action="share-history" data-id="' + item.id + '">\u{1F4E4} Partager</button>' +
      '<button class="btn-outline no-print" data-action="export-history-csv" data-id="' + item.id + '">\u{1F4E5} Exporter en CSV</button>';
  }

  function renderHistory() {
    if (state.historyDetailItem) return renderHistoryDetailScreen(state.historyDetailItem);
    var list = historyDisplayList();
    var itemsHtml;
    if (state.historyLoading && list.length === 0) {
      itemsHtml = '<div class="empty-state">\u23F3 Chargement depuis Supabase\u2026</div>';
    } else if (list.length === 0) {
      itemsHtml = '<div class="empty-state">Aucune sortie enregistr\u00e9e pour l\'instant.' +
        (state.online ? '' : '<br><br>\u26AB Hors ligne \u2014 seules les sorties de cet appareil sont affich\u00e9es.') + '</div>';
    } else {
      itemsHtml = list.map(function (item) {
        var last = item.tops[item.tops.length - 1];
        var pendingTag = item.pendingSync ? ' <span class="sync-pill sync-pending" style="margin-left:6px;">en attente</span>' : '';
        return '<div class="history-item" data-action="view-history-detail" data-id="' + item.id + '">' +
          '<div class="hist-top"><div>' +
          '<div class="lib">' + escapeHtml(item.libelle || "Sortie") + pendingTag + '</div>' +
          '<div class="date">' + formatDateTimeFr(item.dateDebut) + ' \u00b7 ' + item.tops.length + ' tops \u00b7 \u23F1 ' + formatTime(item.dureeTotale) + '</div>' +
          '</div>' +
          '<div class="row gap2">' +
          '<button class="icon-btn" data-action="share-history" data-id="' + item.id + '" aria-label="Partager">\u{1F4E4}</button>' +
          '<button class="icon-btn" data-action="delete-history" data-id="' + item.id + '" aria-label="Supprimer">\u{1F5D1}</button>' +
          '</div></div>' +
          '<div class="stats">\u{1F463} ' + formatDistance(last.distCumulative) + ' \u00b7 \u{1F426} ' + formatDistance(last.distVolOiseau) + '</div>' +
          '</div>';
      }).join("");
    }
    return '<div class="row between" style="margin-bottom:14px;">' +
      '<div class="row gap2"><button class="icon-btn" data-action="back-live" aria-label="Retour">\u2039</button>' +
      '<h1 style="font-size:18px;">Historique</h1></div>' +
      '<button class="icon-btn" data-action="refresh-history" aria-label="Rafra\u00eechir">' + (state.historyLoading ? "\u23F3" : "\u{1F504}") + '</button>' +
      '</div>' +
      errorBannerHtml() +
      itemsHtml;
  }

  // ---------- event delegation ----------
  var app = document.getElementById("app");
  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-action]");
    if (!t || t.disabled) return;
    var action = t.dataset.action;
    if (action === "start-session") startSession();
    else if (action === "add-top") addTop();
    else if (action === "toggle-pause") togglePause();
    else if (action === "finish-session") finishSession();
    else if (action === "new-session") newSession();
    else if (action === "share-current") shareCurrentSession();
    else if (action === "export-current-csv") exportCurrentSessionCsv();
    else if (action === "open-history") openHistory();
    else if (action === "refresh-history") openHistory();
    else if (action === "back-live") { state.screen = "live"; render(); }
    else if (action === "view-history-detail") { state.historyDetailItem = historyDisplayList().find(function (r) { return r.id === t.dataset.id; }) || null; render(); }
    else if (action === "close-history-detail") { state.historyDetailItem = null; render(); }
    else if (action === "print-history-detail") window.print();
    else if (action === "share-history") shareHistoryItem(t.dataset.id);
    else if (action === "export-history-csv") {
      var item = historyDisplayList().find(function (r) { return r.id === t.dataset.id; });
      if (item) exportHistoryItemCsv(item);
    }
    else if (action === "delete-history") deleteHistoryItem(t.dataset.id);
    else if (action === "clear-error") clearError();
  });
  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.matches(".libelle-input")) state.libelle = el.value;
    else if (el.matches(".top-label-input")) renameTop(el.dataset.id, el.value);
  });

  window.addEventListener("online", function () { state.online = true; flushSyncQueue(); render(); });
  window.addEventListener("offline", function () { state.online = false; render(); });

  render();
  if (state.online) flushSyncQueue();
})();

</script>
</body>
</html>
